<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#0055b3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)" />
  
  <!-- Bus Body -->
  <g filter="url(#shadow)" transform="translate(96, 80)">
    <rect x="16" y="24" width="288" height="280" rx="36" fill="#ffffff" />
    <!-- Windshield -->
    <rect x="40" y="52" width="240" height="96" rx="16" fill="#0072ce" />
    <!-- Destination sign -->
    <rect x="80" y="32" width="160" height="14" rx="4" fill="#0f172a" />
    <circle cx="160" cy="39" r="3" fill="#22c55e" />
    
    <!-- Headlights -->
    <circle cx="64" cy="220" r="16" fill="#f59e0b" />
    <circle cx="256" cy="220" r="16" fill="#f59e0b" />
    
    <!-- Grille -->
    <rect x="112" y="210" width="96" height="20" rx="6" fill="#e2e8f0" />
    <line x1="124" y1="220" x2="196" y2="220" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Wheels -->
    <rect x="48" y="296" width="40" height="28" rx="8" fill="#1e293b" />
    <rect x="232" y="296" width="40" height="28" rx="8" fill="#1e293b" />
  </g>
</svg>
